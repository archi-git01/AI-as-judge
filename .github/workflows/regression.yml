name: Continuous Integration AI Regression Suite

# 1. DEFINE TRRIGERS: Run automatically on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    # Use a clean, isolated cloud virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
    # Step A: Checkout the code from your repository onto the cloud machine
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # Step B: Set up the correct Python environment
    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Step C: Install your framework libraries from requirements.txt
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step D: Run the regression tests and inject the Secret API Key securely
    - name: Execute Live AI Regression Suite
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python -m pytest -s -v tests/test_chatbot.py